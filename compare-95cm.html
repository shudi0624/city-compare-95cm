<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成人與95公分視角比較</title>

<style>
body{
  margin:0;
  background:#fff;
  font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
}

.wrap{
  max-width:792px;
  margin:0 auto;
  padding:20px 12px;
  box-sizing:border-box;
}

.title{
  text-align:center;
  font-size:22px;
  font-weight:800;
  color:#003b8f;
  margin-bottom:10px;
  line-height:1.5;
}

.desc{
  text-align:center;
  font-size:15px;
  color:#555;
  margin-bottom:18px;
  line-height:1.7;
}

.compare{
  position:relative;
  width:100%;
  aspect-ratio:792/555;
  overflow:hidden;
  border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.16);
  background:url("https://imgs.gvm.com.tw/upload/gallery/20260430/230561.jpg") center/cover no-repeat;
  cursor:ew-resize;
  touch-action:pan-y;
}

@media (max-width:768px){
  .compare{
    aspect-ratio:792/555;
    border-radius:16px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
  }
}

/* 左側覆蓋圖 */
.overlay{
  position:absolute;
  top:0;
  left:0;
  width:50%;
  height:100%;
  overflow:hidden;
}

.overlay-inner{
  width:792px;
  height:100%;
  background:url("https://imgs.gvm.com.tw/upload/gallery/20260430/230560.jpg") center/cover no-repeat;
}

/* 中間線 */
.line{
  position:absolute;
  top:0;
  left:50%;
  width:3px;
  height:100%;
  background:#fff;
  box-shadow:0 0 10px rgba(0,0,0,.35);
  transform:translateX(-50%);
  z-index:5;
}

/* 中間按鈕 */
.handle{
  position:absolute;
  top:50%;
  left:50%;
  width:56px;
  height:56px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#003b8f;
  font-size:24px;
  font-weight:900;
  z-index:10;
  pointer-events:none;
}

/* 標籤 */
.tag{
  position:absolute;
  top:18px;
  color:#fff;
  padding:8px 16px;
  border-radius:999px;
  font-size:14px;
  font-weight:800;
  line-height:1;
  z-index:20;
  transition:all .25s ease;
}

.tag.left{
  left:18px;
  background:rgba(0,59,143,.92);
}

.tag.right{
  right:18px;
  background:rgba(255,140,0,.96);
}

.note{
  text-align:center;
  font-size:13px;
  color:#777;
  margin-top:14px;
  line-height:1.7;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="title">
    一秒看懂：成人視角與95公分視角差在哪？
  </div>

  <div class="desc">
    左右拖拉中間滑桿，比較不同高度看見的街道世界
  </div>

  <div class="compare" id="compareBox">

    <!-- 左側覆蓋圖 -->
    <div class="overlay" id="overlay">
      <div class="overlay-inner" id="overlayInner"></div>
    </div>

    <!-- 中線 -->
    <div class="line" id="line"></div>

    <!-- 中間按鈕 -->
    <div class="handle" id="handle">↔</div>

    <!-- 標籤 -->
    <div class="tag left" id="tagAdult">
      成人視角
    </div>

    <div class="tag right" id="tagChild">
      95公分視角
    </div>

  </div>

  <div class="note">
    拖曳中間白色滑桿，切換成人與95公分視角。照片來源：嘉義諸羅塾。
  </div>

</div>

<script>
(function(){

  var box = document.getElementById("compareBox");
  var overlay = document.getElementById("overlay");
  var overlayInner = document.getElementById("overlayInner");

  var line = document.getElementById("line");
  var handle = document.getElementById("handle");

  var tagAdult = document.getElementById("tagAdult");
  var tagChild = document.getElementById("tagChild");

  function syncWidth(){
    overlayInner.style.width = box.offsetWidth + "px";
  }

  function updateTags(percent){

    if(percent < 50){

      tagAdult.style.display = "block";
      tagChild.style.display = "none";

    }else{

      tagAdult.style.display = "none";
      tagChild.style.display = "block";

    }
  }

  function move(clientX){

    var rect = box.getBoundingClientRect();

    var x = clientX - rect.left;

    if(x < 0){ x = 0; }

    if(x > rect.width){ x = rect.width; }

    var percent = (x / rect.width) * 100;

    overlay.style.width = percent + "%";

    line.style.left = percent + "%";

    handle.style.left = percent + "%";

    updateTags(percent);
  }

  /* 桌機 */
  box.addEventListener("mousedown", function(e){
    move(e.clientX);
  });

  box.addEventListener("mousemove", function(e){

    if(e.buttons === 1){
      move(e.clientX);
    }

  });

  /* 手機 */
  box.addEventListener("touchstart", function(e){

    if(e.touches.length){
      move(e.touches[0].clientX);
    }

  }, {passive:false});

  box.addEventListener("touchmove", function(e){

    if(e.touches.length){

      move(e.touches[0].clientX);

      e.preventDefault();
    }

  }, {passive:false});

  /* resize */
  window.addEventListener("resize", syncWidth);

  window.addEventListener("load", syncWidth);

  syncWidth();

  updateTags(50);

})();
</script>

</body>
</html>
